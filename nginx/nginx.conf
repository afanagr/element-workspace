resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 512m;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # WebSocket chat stream
    location /api/ws/ {
        set $backend_ws http://backend:8000;
        proxy_pass $backend_ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # REST API (matches both /api and /api/...)
    location /api {
        set $backend_api http://backend:8000;
        proxy_pass $backend_api;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Next.js static assets (immutable)
    location /_next/static/ {
        set $frontend_static http://frontend:3000;
        proxy_pass $frontend_static;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        set $frontend_ui http://frontend:3000;
        proxy_pass $frontend_ui;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

name: ai-file-workspace

x-app-env: &app-env
  APP_NAME: "Element Workspace"
  APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-insecure-secret-change-me}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
  DATABASE_URL: postgresql+asyncpg://workspace:${POSTGRES_PASSWORD:-workspace}@postgres:5432/workspace
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-workspace_documents}
  WORKSPACE_DIR: /data/workspace
  # Legacy endpoints: read only by migration 0005 when it imports credentials
  # from pre-v2 releases. Chat models are configured per account in /admin, so
  # these six lines can be deleted after the upgrade.
  LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
  QWEN_LOCAL_BASE_URL: ${QWEN_LOCAL_BASE_URL:-}
  QWEN_LOCAL_MODEL: ${QWEN_LOCAL_MODEL:-qwen2.5:7b-instruct}
  LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
  CHUNK_SIZE: ${CHUNK_SIZE:-1200}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
  RAG_TOP_K: ${RAG_TOP_K:-6}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
  # Scanned PDFs: per-page rasterisation + Tesseract (empty = tesseract_lang).
  OCR_PDF_ENABLED: ${OCR_PDF_ENABLED:-true}
  OCR_LANG: ${OCR_LANG:-}
  OCR_DPI: ${OCR_DPI:-300}
  OCR_MAX_PAGES: ${OCR_MAX_PAGES:-200}
  OCR_MIN_PAGE_CHARS: ${OCR_MIN_PAGE_CHARS:-20}
  OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-120}
  OCR_BUDGET_SECONDS: ${OCR_BUDGET_SECONDS:-540}
  OCR_DESKEW: ${OCR_DESKEW:-true}
  MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-8}
  LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-180}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  # OnlyOffice replaces the built-in editors when enabled; set
  # ONLYOFFICE_ENABLED=false to fall back to the legacy viewers.
  ONLYOFFICE_ENABLED: ${ONLYOFFICE_ENABLED:-false}
  ONLYOFFICE_URL: ${ONLYOFFICE_URL:-}
  ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
  ONLYOFFICE_API_URL: ${ONLYOFFICE_API_URL:-http://backend:8000}
  ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:-http://documentserver}
  ONLYOFFICE_CONVERT_ENABLED: ${ONLYOFFICE_CONVERT_ENABLED:-true}
  ONLYOFFICE_CONVERT_TIMEOUT: ${ONLYOFFICE_CONVERT_TIMEOUT:-120}
  ONLYOFFICE_LANG: ${ONLYOFFICE_LANG:-ru}
  ONLYOFFICE_ALLOWED_HOSTS: ${ONLYOFFICE_ALLOWED_HOSTS:-documentserver,localhost,127.0.0.1}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workspace}
      POSTGRES_DB: workspace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - workspace_data:/data/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status < 500 else 1)"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - workspace_data:/data/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping --timeout=10 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  documentserver:
    image: onlyoffice/documentserver:10.0
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
      # Documents are served by the internal backend URL (a private address).
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      USE_UNAUTHORIZED_STORAGE: "false"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    # ~2 GB is the recommended minimum for the Community Edition; the limit
    # keeps the rest of the stack safe on small servers.
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 25s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
      # OnlyOffice Document Server is proxied on its own port because it builds
      # absolute URLs and does not support running behind a sub-path.
      - "${ONLYOFFICE_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  workspace_data:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  onlyoffice_db:
